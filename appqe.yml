# appqe.yml - Conduit API QE (C# / xUnit integration tests).
#
# Targets the public RealWorld "Conduit" API (https://api.realworld.show/api).
# API tests are generated as .NET xUnit with a typed client generated from the
# OpenAPI spec (NSwag) and Allure reporting. API-only project.

project_name: conduit-api-qe
client_name: "RealWorld Conduit"

scope: api                     # API-only: no UI content is deployed
profile: openapi_xunit         # API tests generated as .NET xUnit (C#)
api_language: "C#"

api:
  openapi_path: specs/openapi.json
  base_url: https://api.realworld.show/api   # public demo backend (non-prod)
  tests_dir: tests/api
  auth_scheme: "Token JWT (Authorization: Token <jwt>)"

# ── Jira ──────────────────────────────────────────────────────────────
# Everything Jira lives here, in one block, so there is one place to read and
# one place to change. The split is by nature, not by whim:
#
#   • host + project    -> config (below). Non-secret, shared by the whole team,
#                          committed once. utilities/jira_client.py reads them
#                          straight from this file.
#   • the API token     -> environment only (JIRA_EMAIL + JIRA_API_TOKEN in
#                          env/.env, git-ignored). A committed token is a
#                          published token, and the pre-tool guardrail blocks a
#                          literal secret in an edit regardless.
#
# So a developer sets two env vars and nothing else; the host and project are
# already correct. Token: id.atlassian.com/manage-profile/security/api-tokens

tracker:
  base_url: https://slalom.atlassian.net     # Jira host (read by jira_client.py)
  project_key: QEBS                          # default project - bare `123` -> QEBS-123
  # Nothing else to declare: the acceptance-criteria field id varies per Jira
  # instance, so the client discovers it by name from the instance itself.

tools:
  jira: utilities/jira_client.py             # appqe names it; the agent runs it
  # confluence: mcp:atlassian/getConfluencePage
  # sharepoint: mcp:sharepoint/getFile
  # Any other key is kept and exposed as {{tools.<name>}}, so a system appqe has
  # never heard of can be wired without forking it.

api_test_runner: dotnet test
default_platform: copilot       # names the AGENT, not the editor

# Model tiers - defaults shown; tune per project.
models:
  coordinator: sonnet            # drives the loop, holds the run context
  tiers:                       # workers take a tier from the step's complexity
    light: haiku
    standard: sonnet
    deep: sonnet
  workers: {}                  # per-role override, e.g. spec_survey: haiku

security:
  allow_prod: false
  allowed_hosts:
    - api.realworld.show
  prod_markers:
    - prod
    - production
    - live
  allowed_commands:
    - appqe      # the orchestrator's own CLI - without this the guard blocks the run loop
    - mkdir
    - dotnet
    - nswag
    - allure
  redact_pii: true

quality:
  min_endpoint_coverage: 0.8
  self_review_iterations: 2
  flaky_reruns: 3              # re-runs used to classify a failure as flaky

intents:
  - mode: bug_retest
    pattern: verify the fix for CONDUIT-\d+
    confidence: 0.95

# No gate is auto-approved. generation_review previously was, which silently
# disabled the review the agent instructions call non-optional - tests reached
# "final" without anyone reading them.
gates: {}
